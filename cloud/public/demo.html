<!doctype html><html lang="vi"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cửa hàng demo · Event QA</title><style>body{font:18px/1.6 system-ui;background:#edf2ff;color:#162b52;margin:0;padding:55px}main{background:white;max-width:950px;margin:auto;padding:40px;border-radius:20px}h1{font-size:36px}input,button{font:inherit;padding:13px 18px;border:1px solid #cad6ee;border-radius:9px}button{background:#315cf4;color:white;cursor:pointer}section{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}.item{border:1px solid #dce4f2;border-radius:12px;padding:25px}#result{color:#178464;min-height:32px}small{color:#768aaa}</style><main><small>WEBSITE DEMO · KHÔNG PHẢI WEBSITE THẬT</small><h1>Thử tìm kiếm và thêm vào giỏ</h1><p>Thao tác ở đây để thấy JS queue và request xuất hiện trong công cụ.</p><form id="search"><input id="term" placeholder="Bạn muốn tìm gì?" value="Đà Nẵng"><button>Tìm kiếm</button></form><section><div class="item"><h2>Khách sạn ven biển</h2><p>Đà Nẵng · 2 người lớn</p><button id="hotel">Xem khách sạn</button></div><div class="item"><h2>Áo thun du lịch</h2><p>110.000 đ</p><button id="cart">Thêm vào giỏ</button></div></section><p><label><input type="checkbox" id="missing"> Bỏ destination_id để thử phát hiện thiếu trường</label></p><p id="result"></p><div style="height:500px"></div><p>Bạn đã cuộn xuống cuối trang demo.</p></main><script>window.dataLayer=[];window.InsiderQueue=[];const fire=(event,data={})=>{dataLayer.push({event,...data});fetch('/demo/g/collect?en='+encodeURIComponent(event)+'&'+new URLSearchParams(Object.fromEntries(Object.entries(data).map(([k,v])=>['ep.'+k,v]))),{method:'POST'}).catch(()=>{});};fire('page_view',{page_location:location.href});document.querySelector('#search').onsubmit=e=>{e.preventDefault();const data={search_term:document.querySelector('#term').value,service:'hotel'};if(!document.querySelector('#missing').checked)data.destination_id='DN';fire('search_submit',data);document.querySelector('#result').textContent='Đã tìm kiếm: '+data.search_term;};document.querySelector('#hotel').onclick=()=>{fire('select_item',{item_id:'HOTEL-102',service:'hotel'});document.querySelector('#result').textContent='Đã chọn khách sạn.';};document.querySelector('#cart').onclick=()=>{const value={event_name:'add_to_cart',event_parameters:{custom:{product_id:'SHIRT-01',quantity:1}}};InsiderQueue.push({type:'custom_event',value:[value]});fetch('/demo/insider/api/event/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events:[{event_name:'add_to_cart',event_params:{custom:{product_id:'SHIRT-01',quantity:1}}}]})}).catch(()=>{});document.querySelector('#result').textContent='Đã thêm áo vào giỏ.';};</script></html>
